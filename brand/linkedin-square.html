<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:1200px;background:radial-gradient(120% 90% at 50% 0%,#151b27 0%,#0b0e14 60%);font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;color:#e8ecf3;overflow:hidden;position:relative}
.sheet{position:absolute;top:90px;left:90px;right:90px;display:grid;grid-template-columns:repeat(5,1fr);gap:22px;-webkit-mask-image:linear-gradient(#000 45%,transparent 100%)}
.t{aspect-ratio:3/2;border-radius:14px;position:relative;overflow:hidden;opacity:.55;border:2px solid #262d3b}
.t i{position:absolute;bottom:0;height:42%;background:rgba(0,0,0,.28);border-radius:50% 50% 0 0}
.t .x{position:absolute;inset:0;background:rgba(11,14,20,.55)}
.t.keep{opacity:1;border:4px solid #ff8a3d;box-shadow:0 0 0 8px rgba(255,138,61,.18),0 18px 50px rgba(255,138,61,.35);transform:scale(1.12);z-index:2}
.badge{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;background:#ff8a3d;display:grid;place-items:center}
.badge svg{width:26px}
.brand{position:absolute;left:90px;right:90px;bottom:110px}
.row{display:flex;align-items:center;gap:34px}
.row svg{width:170px;height:170px;flex:none;border-radius:38px;box-shadow:0 0 0 2px #262d3b}
h1{font-size:140px;font-weight:800;letter-spacing:-4px;line-height:1}
h1 span{color:#ff8a3d}
p.tag{margin-top:44px;font-size:50px;font-weight:600;letter-spacing:-.5px;line-height:1.15}
p.sub{margin-top:22px;font-size:25px;color:#9aa5b8;font-family:ui-monospace,"SF Mono",monospace;letter-spacing:.5px}
.url{position:absolute;right:90px;bottom:60px;font-size:24px;color:#9aa5b8;font-family:ui-monospace,"SF Mono",monospace}
</style></head><body>
